name: Daily Otif Report

on:
  schedule:
    # 5:10 AM Dhaka Time (UTC+6) = 23:10 UTC Previous Day
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Credentials.json
      run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > Credentials.json

    - name: Run Scripts
      env:
        ODOO_URL: ${{ secrets.ODOO_URL }}
        ODOO_DB: ${{ secrets.ODOO_DB }}
        ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
        ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      run: |
        python running-order-button.py
        python running-order-zipper.py
